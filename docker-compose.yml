version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fullstack-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack-app
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fullstack_db?schema=public
      NODE_ENV: production
    ports:
      - '3000:3000'
    env_file:
      - .env

volumes:
  postgres-data:
